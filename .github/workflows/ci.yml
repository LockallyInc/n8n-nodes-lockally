name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: a transitive native dependency of n8n-workflow builds
      # from source and is not needed to typecheck, lint or test this package.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
