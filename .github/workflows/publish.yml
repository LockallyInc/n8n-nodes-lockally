# n8n requires community nodes to be published by a GitHub action with an npm
# provenance statement, so that what is on npm can be traced to the commit and
# workflow that built it. Publishing from a laptop is no longer accepted.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Provenance is signed with this token; without it npm publishes unsigned.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm install, not npm ci: inside @n8n/node-cli's own dependency tree
      # eslint pins ignore@5 while @langchain/community asks for ignore@7, and
      # npm's dedupe leaves a lockfile that `npm ci` refuses. These are dev
      # tools only; the published package has no runtime dependencies at all.
      # --ignore-scripts skips a transitive native build that is not needed here.
      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # --provenance signs what was published to this commit and workflow,
      # which n8n requires of community nodes from May 2026.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
