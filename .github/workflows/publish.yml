# n8n requires community nodes to be published by a GitHub action with an npm
# provenance statement, so that what is on npm can be traced to the commit and
# workflow that built it. Publishing from a laptop is no longer accepted.
#
# That provenance now comes from publishing itself. This workflow authenticates
# by OIDC trusted publishing rather than a stored npm token: npm exchanges the
# job's short-lived token for a publish credential, and attaches provenance to
# what it publishes without being asked. So there is no NPM_TOKEN and no
# `--provenance` flag, and n8n's requirement is still met.
#
# One-time setup (no repo secret at all):
#   - On npmjs.com, n8n-nodes-lockally, Settings, Trusted publisher,
#     GitHub Actions:
#       Organization or user:  LockallyInc
#       Repository:            n8n-nodes-lockally
#       Workflow filename:     publish.yml
#       Environment:           leave empty (this workflow declares none)
#   - Under "Allowed actions", tick **Allow npm publish**. Policies created from
#     September 2026 default to `npm stage publish` only, and this workflow runs
#     a plain `npm publish`, so without that tick the release is refused.
#   - A new policy expires unless it completes a successful publish within 2
#     days, so register it when the release is ready to go.
#   - `LockallyInc` with that exact casing: npm compares these fields
#     case-sensitively, and package.json's repository.url already matches.
#   The policy is registered by the account owner in the npm UI; no value from
#   it is ever stored here.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # What npm verifies in place of a token, and what signs the provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing has two floors: npm >= 11.5.1 and Node >= 22.14.0.
      # Node 22 ships npm 10.x, so the publishing npm is installed rather than
      # inherited. npm 11.21.2 is the newest line that still accepts Node 22
      # (npm 12 wants >= 22.22). The pinned `node-version: 22` already clears
      # the Node floor, and the assertion keeps it that way.
      #
      # Both are asserted because neither failure says what it is. An npm too
      # old looks for a token it will not find and dies on ENEEDAUTH, which
      # reads like a missing secret; a Node below the floor is refused by the
      # exchange. Either way you end up looking in the wrong place.
      - name: Install an npm that can do trusted publishing
        run: |
          npm install -g npm@11.21.2
          npm_want=11.5.1
          npm_have=$(npm --version)
          node_have=$(node --version); node_have=${node_have#v}
          node_want=22.14.0
          echo "node $node_have, npm $npm_have"
          if [ "$(printf '%s\n%s\n' "$npm_want" "$npm_have" | sort -V | head -1)" != "$npm_want" ]; then
            echo "::error::npm $npm_have cannot do OIDC trusted publishing (need >= $npm_want). Pin a newer npm in this step; this release has no token to fall back on."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$node_want" "$node_have" | sort -V | head -1)" != "$node_want" ]; then
            echo "::error::Node $node_have is below npm trusted publishing's floor of $node_want. Raise node-version in the setup-node step above."
            exit 1
          fi

      # npm install, not npm ci: inside @n8n/node-cli's own dependency tree
      # eslint pins ignore@5 while @langchain/community asks for ignore@7, and
      # npm's dedupe leaves a lockfile that `npm ci` refuses. These are dev
      # tools only; the published package has no runtime dependencies at all.
      # --ignore-scripts skips a transitive native build that is not needed here.
      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # No NODE_AUTH_TOKEN. npm exchanges the job's OIDC token for a short-lived
      # credential and signs provenance with it; with no matching trusted
      # publisher on npmjs.com this fails (E404/E403) rather than publishing
      # unsigned or skipping.
      - run: npm publish --access public
